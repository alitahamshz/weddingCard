<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:'GV';src:url('node_modules/@fontsource/great-vibes/files/great-vibes-latin-400-normal.woff2') format('woff2');font-display:block;}
#out{font-family:monospace}
</style></head>
<body><div id="out">pending</div>
<script>
const names=['AREZOO','ALI'];
document.fonts.load('28px GV').then(function(){
  const c=document.createElement('canvas');
  const ctx=c.getContext('2d');
  const s=[];
  [28,36].forEach(function(px){
    names.forEach(function(n){
      ctx.font=px+'px GV';
      const m=ctx.measureText(n);
      const tracked=m.width + 0.02*px*(n.length-1);
      const ink=Math.abs(m.actualBoundingBoxLeft)+m.actualBoundingBoxRight;
      s.push(n+'@'+px+' adv='+m.width.toFixed(1)+' tracked='+tracked.toFixed(1)+' ink='+ink.toFixed(1)+' inkL='+Math.abs(m.actualBoundingBoxLeft).toFixed(1)+' inkR='+m.actualBoundingBoxRight.toFixed(1)+' asc='+m.fontBoundingBoxAscent.toFixed(1)+' desc='+m.fontBoundingBoxDescent.toFixed(1));
    });
  });
  const txt='RESULT>'+s.join(' || ')+'<';
  document.getElementById('out').textContent=txt;
  document.title=txt;
});
</script></body></html>
